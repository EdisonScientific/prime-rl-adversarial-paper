max_steps = 20000
output_dir = "outputs/sft-baseline-grant-abstracts"

[deployment]
num_train_gpus = 6
num_infer_gpus = 2

[ckpt]
interval = 1000
keep_last = 2

[model]
name = "Qwen/Qwen3-32B"
attn = "flash_attention_2"
optim_cpu_offload = false
fused_lm_head_token_chunk_size = "disabled"

[data]
name = "EdisonScientific/grant-abstracts-NIH-fy2026-sft"
seq_len = 2048
batch_size = 72
micro_batch_size = 2
accuracy_ignore_strings = ["<answer>", "</answer>"]

[optim]
lr = 1e-5

[monitors.wandb]
project = "sft-baselines"
name = "grant-abstracts-qwen3-32b-20ksteps"

[weight_broadcast]
type = "nccl"
port = 29801

[eval]
env_server_base_port = 5300
interval = 100
num_examples = 128

[eval.concurrency]
initial_inflight = 256
max_inflight = 256

[eval.sampling]
temperature = 1.0
max_completion_tokens = 1280
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[[eval.source]]
name = "grant-abstracts"
env.taskset.id = "grant_abstracts"
env.taskset.split = "validation"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[eval.source]]
name = "grant-abstracts-train"
num_examples = 128
env.taskset.id = "grant_abstracts"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]

[inference.server]
port = 8060
