max_steps = 200
output_dir = "outputs/sft-baseline-multiplication"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[ckpt]

[model]
name = "Qwen/Qwen3-0.6B"
attn = "flash_attention_2"

[data]
name = "EdisonScientific/multiplication-sft"
seq_len = 2048
batch_size = 128
micro_batch_size = 8

[optim]
lr = 3e-5

[monitors.wandb]
project = "sft-baselines"
name = "multiplication-qwen3-0.6b-20k-b256"

[eval]
interval = 20
num_examples = 800

[eval.concurrency]
initial_inflight = 1056
max_inflight = 1056

[eval.sampling]
temperature = 1.0
max_completion_tokens = 4096
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[[eval.source]]
name = "multiplication"
env.taskset.id = "multiplication"
env.taskset.split = "validation"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[eval.source]]
name = "multiplication-train"
num_examples = 256
env.taskset.id = "multiplication"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]
