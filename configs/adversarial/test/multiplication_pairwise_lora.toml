output_dir = "outputs/adversarial-test-multiplication-pairwise-lora"
generator_reward_mode = "judge"
judge_objective = "pairwise"

[judge_update_gate]
enabled = true
accuracy_threshold = 0.75
warmup_steps = 0
max_skip_streak = 100

[generator]
max_steps = 3000
seq_len = 8192

[generator.model]
name = "Qwen/Qwen3-0.6B"

[generator.wandb]
project = "testing-adversarial"
name = "adversarial-test-multiplication-pairwise-lora"

[generator.trainer.model]
attn = "flash_attention_2"

[generator.trainer.model.lora]
rank = 16

[generator.trainer.loss]
type = "default"
kl_tau = 0.02

[generator.trainer.optim]
lr = 1e-5

[generator.trainer.scheduler]
type = "constant"

[generator.deployment]
type = "single_node"
gpus_per_node = 4
num_infer_gpus = 1
num_train_gpus = 1

[generator.orchestrator]
batch_size = 128
rollouts_per_example = 8
seed = 42

[generator.orchestrator.eval]
interval = 250
num_examples = 800
group_size = 1

[generator.orchestrator.client]
base_url = "http://localhost:8000/v1"

[generator.orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 2048
extra_body = { top_k = 20, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } }

[generator.orchestrator.train.env]
id = "prime_rl.adversarial.envs"
name = "adversarial_generator"
args = { kind = "generator", task = "multiplication", n_digits = 4, num_examples = 20000, num_eval_examples = 800, seed = 1 }

[generator.inference.server]
port = 8000

[generator.inference.vllm]
max_model_len = 8192

[judge]
max_steps = 3000
seq_len = 2048

[judge.model]
name = "Qwen/Qwen3-1.7B"

[judge.trainer.model]
attn = "flash_attention_2"
fused_lm_head_token_chunk_size = "disabled"

[judge.trainer.model.lora]
rank = 16

[judge.trainer.loss]
type = "default"
kl_tau = 0.0

[judge.trainer.optim]
lr = 3e-5

[judge.trainer.scheduler]
type = "constant"

[judge.deployment]
type = "single_node"
gpus_per_node = 4
num_infer_gpus = 1
num_train_gpus = 1

[judge.orchestrator]
batch_size = 128
rollouts_per_example = 1

[judge.orchestrator.client]
base_url = "http://localhost:8001/v1"

[judge.orchestrator.train.sampling]
temperature = 0.0
max_completion_tokens = 1
extra_body = { chat_template_kwargs = { enable_thinking = false }, structured_outputs = { choice = ["A", "B"] } }

[judge.orchestrator.train.env]
id = "prime_rl.adversarial.envs"
name = "adversarial_judge"
args = { kind = "judge", pairwise = true }

[judge.inference.server]
port = 8001

[judge.inference.vllm]
max_model_len = 2048
