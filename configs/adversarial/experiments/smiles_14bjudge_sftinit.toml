output_dir = "outputs/adversarial-smiles2formula-8bgen-14bjudge-sftinit"

[generator.wandb]
name = "smiles2formula-8bgen-14bjudge-b64r8-ipo-1node-sftinit"

# Generator initialized from the smiles2formula SFT baseline (step 1000, 94.4%
# exact-formula accuracy) instead of the base model. The SFT model was trained
# and evaluated with thinking disabled, so generation and the format gate match.
[generator.model]
name = "/home/abou/code/prime-rl-adversarial/outputs/sft-baseline-smiles2formula/smiles2formula-sft--qwen3-8b--87d62c41/checkpoints/step_1000/weights"

[generator.orchestrator.train.sampling]
extra_body = { top_k = 20, min_p = 0.0, chat_template_kwargs = { enable_thinking = false } }

# Local fine-tune paths miss the auto renderer map on purpose; the SFT export
# keeps the stock Qwen3 chat template, so select its renderer explicitly.
[generator.orchestrator.renderer]
name = "qwen3"

[generator.orchestrator.train.env]
args = { require_reasoning = false }

[judge.model]
name = "Qwen/Qwen3-14B"

# The 14B judge takes the rest of the node: TP-2 serving, two trainer GPUs.
[generator.deployment]
gpus_per_node = 8
num_infer_gpus = 2
num_train_gpus = 2

[generator.inference.vllm]
tensor_parallel_size = 2

[judge.deployment]
gpus_per_node = 8
num_infer_gpus = 2
num_train_gpus = 2

[judge.inference.vllm]
tensor_parallel_size = 2
max_model_len = 2048
