output_dir = "outputs/adversarial-grant-nih-32bgen-235bjudge-fullft"

[judge_replay]
fraction = 0.5
buffer_batches = 500

[judge_update_gate]
max_skip_streak = 50

[generator]
max_steps = 3000
seq_len = 8192

[generator.model]
name = "Qwen/Qwen3-32B"

[generator.wandb]
project = "grant_nih_v2"
name = "grant-nih-32bgen-235bjudge-b1024r16-ipo-fullft-kl1e2-ema0995-replay512w500-7nodes"

[generator.trainer]
dist_timeout_seconds = 7200

[generator.trainer.loss]
kl_tau = 0.01

[generator.trainer.optim]
lr = 2e-7

[generator.weight_broadcast]
type = "nccl"
port = 29541
timeout = 7200

[generator.deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 2
num_infer_nodes = 1

[generator.trainer.ckpt]
interval = 100
keep_last = 2
save_threads = 8

[generator.orchestrator]
batch_size = 1024
rollouts_per_example = 16

[generator.orchestrator.train.env]
args = { task = "grant_abstract", kind = "generator", seed = 1, hf_dataset = "EdisonScientific/grant-abstracts-NIH-fy2026-sft", num_examples = 19995 }

[generator.orchestrator.eval]
interval = 100
num_examples = -1

[generator.orchestrator.train]
max_retries = 8

[generator.orchestrator.train.sampling]
max_completion_tokens = 4096
extra_body = { top_k = -1, min_p = 0.0, chat_template_kwargs = { enable_thinking = true }, thinking_token_budget = 1536 }

[generator.inference.vllm]
tensor_parallel_size = 8
max_model_len = 5120
reasoning_parser = "qwen3"

[judge]
max_steps = 3000
seq_len = 4096

[judge.model]
name = "Qwen/Qwen3-235B-A22B"

[judge.trainer]
dist_timeout_seconds = 7200

[judge.trainer.optim]
lr = 3e-7

[judge.weight_broadcast]
type = "nccl"
port = 29542
timeout = 7200
ema_decay = 0.995

[judge.deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 3
num_infer_nodes = 1
num_infer_replicas = 1

[judge.orchestrator]
batch_size = 3072

[judge.orchestrator.train]
max_retries = 8

[judge.trainer.ckpt]
interval = 100000
boundary_interval = 100
keep_last = 1
save_threads = 8

[judge.inference.vllm]
max_num_batched_tokens = 32768
tensor_parallel_size = 8
moe_backend = "flashinfer_cutlass"
max_model_len = 4096
