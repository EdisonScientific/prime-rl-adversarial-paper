output_dir = "outputs/adversarial-smiles2formula-8bgen-32bjudge"

[generator]
max_steps = 15000

[generator.model]
name = "Qwen/Qwen3-8B"

[generator.wandb]
project = "smiles2formula_v2"
name = "smiles2formula-8bgen-32bjudge-b64r8-ipo-2nodes"

[generator.trainer.loss]
kl_tau = 0.005

[generator.trainer.optim]
lr = 5e-7

[generator.weight_broadcast]
type = "nccl"

[generator.deployment]
gpus_per_node = 8
num_infer_gpus = 1
num_train_gpus = 7

[generator.orchestrator]
batch_size = 512

[judge.orchestrator]
batch_size = 1024

[generator.orchestrator.train.sampling]
max_completion_tokens = 4096
extra_body = { top_k = -1, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } }

[judge]
max_steps = 15000

[judge.model]
name = "Qwen/Qwen3-32B"

[judge.trainer.optim]
lr = 1e-6

[judge.weight_broadcast]
type = "nccl"

[judge.deployment]
gpus_per_node = 8
num_infer_gpus = 2
num_train_gpus = 6

[judge.inference.vllm]
tensor_parallel_size = 2
max_model_len = 2048

[judge_update_gate]
max_skip_streak = 50
