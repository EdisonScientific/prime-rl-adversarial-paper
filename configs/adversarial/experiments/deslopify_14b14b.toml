output_dir = "outputs/adversarial-deslopify-14bgen-14bjudge"

[judge_update_gate]
accuracy_threshold = 0.70

[generator]
max_steps = 15000

[generator.model]
name = "Qwen/Qwen3-14B"

[generator.wandb]
project = "deslopify_v1"
name = "deslopify-14bgen-14bjudge-b1024r16-ipo-2nodes"

[generator.trainer.loss]
kl_tau = 0.005

[generator.trainer.optim]
lr = 5e-7

[generator.weight_broadcast]
type = "nccl"

[generator.deployment]
gpus_per_node = 8
num_infer_gpus = 4
num_train_gpus = 4

[generator.orchestrator]
batch_size = 1024
rollouts_per_example = 16

[generator.orchestrator.eval]
num_examples = -1
interval = 50

[generator.orchestrator.train.sampling]
max_completion_tokens = 3500
extra_body = { top_k = -1, min_p = 0.0, chat_template_kwargs = { enable_thinking = true }, thinking_token_budget = 1536 }

[generator.inference.vllm]
tensor_parallel_size = 4
# Prompts run up to ~700 tokens and completions cap at 3500; a tight ceiling
# frees KV cache for more concurrent decodes.
max_model_len = 4608
# Auto-detection leaves hybrid Qwen3 models parserless, but thinking_token_budget
# requires the server to track the reasoning block.
reasoning_parser = "qwen3"

[judge]
max_steps = 15000

[judge.model]
name = "Qwen/Qwen3-14B"

[judge.trainer.optim]
lr = 1e-6

[judge.weight_broadcast]
type = "nccl"

[judge.deployment]
gpus_per_node = 8
num_infer_gpus = 2
num_train_gpus = 6

[judge.orchestrator]
batch_size = 2048

[judge.inference.vllm]
# Judge steps are prefill-heavy; bigger chunked-prefill bites cut the tail.
max_num_batched_tokens = 32768
tensor_parallel_size = 2
max_model_len = 2048
