output_dir = "outputs/adversarial-grant-nih-32bgen-235bjudge-lora"

[judge_update_gate]
accuracy_threshold = 0.70

[generator]
max_steps = 15000
seq_len = 8192

[generator.model]
name = "Qwen/Qwen3-32B"

[generator.wandb]
project = "grant_nih_v2"
name = "grant-nih-32bgen-235bjudge-b1024r16-ipo-lora-3nodes"

[generator.trainer.loss]
kl_tau = 0.001

[generator.trainer.model.lora]
rank = 32

[generator.trainer.optim]
lr = 3e-6

[generator.deployment]
gpus_per_node = 8
num_infer_gpus = 4
num_train_gpus = 4

[generator.orchestrator]
batch_size = 1024
rollouts_per_example = 16

[generator.orchestrator.train.env]
args = { task = "grant_abstract", kind = "generator", seed = 1, hf_dataset = "EdisonScientific/grant-abstracts-NIH-fy2026-sft", num_examples = 19995 }

[generator.orchestrator.train.sampling]
max_completion_tokens = 3500
extra_body = { top_k = -1, min_p = 0.0, chat_template_kwargs = { enable_thinking = true }, thinking_token_budget = 1536 }

[generator.inference.vllm]
tensor_parallel_size = 4
max_model_len = 8192
# Auto-detection leaves hybrid Qwen3 models parserless, but thinking_token_budget
# requires the server to track the reasoning block.
reasoning_parser = "qwen3"

[judge]
max_steps = 15000
seq_len = 4096

[judge.model]
name = "Qwen/Qwen3-235B-A22B"

[judge.trainer.model.lora]
rank = 32
# Attention only: expert-covering adapters on the 235B MoE are multi-GB and
# time out (or fail) in vLLM's adapter loading.
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[judge.trainer.optim]
lr = 3e-6

[judge.deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 1
num_infer_nodes = 1

[judge.orchestrator]
batch_size = 2048

[judge.inference.vllm]
tensor_parallel_size = 8
max_model_len = 4096
