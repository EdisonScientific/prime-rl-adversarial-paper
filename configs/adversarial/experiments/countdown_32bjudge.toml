output_dir = "outputs/adversarial-countdown-1p7b32b"

[generator.wandb]
name = "countdown-1.7bgen-32bjudge-b64r8-ipo"

[judge.model]
name = "Qwen/Qwen3-32B"

# Two nodes, mirroring the smiles 8B/32B layout: the generator takes node one,
# the 32B judge serves at TP-2 and trains on six GPUs of node two.
[generator.weight_broadcast]
type = "nccl"

[generator.deployment]
gpus_per_node = 8
num_infer_gpus = 4
num_train_gpus = 4

[generator.inference.vllm]
tensor_parallel_size = 4
max_model_len = 16384

[judge.weight_broadcast]
type = "nccl"

[judge.deployment]
gpus_per_node = 8
num_infer_gpus = 2
num_train_gpus = 6

[judge.inference.vllm]
tensor_parallel_size = 2
max_model_len = 2048
