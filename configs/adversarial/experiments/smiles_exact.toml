output_dir = "outputs/adversarial-smiles2formula-8bgen-exact"
generator_reward_mode = "exact_only"

# Freeze the judge: the gate skips every update and nothing ever forces one,
# so the 0.6B judge only provides (ignored) scoring metrics.
[judge_update_gate]
accuracy_threshold = 0.0
max_skip_streak = "None"

[generator.wandb]
name = "smiles2formula-8bgen-exact-b64r8-ipo-1node-tp4"

[generator.weight_broadcast]
type = "nccl"
port = 29531

[generator.deployment]
gpus_per_node = 8
num_infer_gpus = 4
num_train_gpus = 2

[generator.inference.vllm]
tensor_parallel_size = 4
# Prompts run ~150 tokens and completions cap at 4096; a tight ceiling frees
# KV cache headroom.
max_model_len = 4608

[judge.model]
name = "Qwen/Qwen3-0.6B"

[judge.weight_broadcast]
type = "nccl"
port = 29532

[judge.deployment]
gpus_per_node = 8
num_infer_gpus = 1
num_train_gpus = 1

[judge.inference.vllm]
tensor_parallel_size = 1
max_model_len = 2048
