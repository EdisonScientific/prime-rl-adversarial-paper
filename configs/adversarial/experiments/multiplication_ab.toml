# Synchronous arm of the native-vs-sync A/B: identical models and
# hyperparameters to configs/adversarial_native/multiplication.toml on the
# feat/adversarial-native branch (0.6B/0.6B, b128 r8, max 2048, gen lr 1e-7,
# kl_tau 0.02, judge lr 1e-6, gate 0.90/skip 20, eval 128 every 50 steps).
# Both arms log to the same wandb project for direct comparison.

output_dir = "outputs/adversarial-mult-ab-sync"

[judge_update_gate]
accuracy_threshold = 0.90
max_skip_streak = 20

[generator.wandb]
project = "adversarial-native"
name = "multiplication-4digit-0.6bgen-0.6bjudge-b128r8-sync"

[generator.orchestrator.eval]
interval = 50
num_examples = 128
group_size = 1

[generator.orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 2048
extra_body = { top_k = -1, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } }

[judge.model]
name = "Qwen/Qwen3-0.6B"

[judge.trainer.optim]
lr = 1e-6
