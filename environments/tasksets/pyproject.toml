[project]
name = "sft-eval-tasksets"
version = "0.1.0"
description = "Eval tasksets porting the adversarial RL scoring rules."
requires-python = ">=3.11"
dependencies = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multiplication", "countdown", "smiles2formula", "grant_abstracts", "taskset_common"]
