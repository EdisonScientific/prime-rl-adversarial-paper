[project]
name = "grant-abstracts"
version = "0.1.0"
description = "grant_abstracts - title-conditioned NIH grant abstract generation, format-scored only."
requires-python = ">=3.11"
dependencies = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grant_abstracts"]
