[project]
name = "smiles2formula"
version = "0.1.0"
description = "smiles2formula - molecular formula prediction with exact atom-count verification."
requires-python = ">=3.11"
dependencies = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smiles2formula"]
